# One-command dev environment.
#
# Usage:
#   docker compose run --rm dev        # interactive shell
#   docker compose run --rm dev bash -c "zig build check"
#   docker compose run --rm dev scripts/dev.sh regress
#
# First run builds the image (~3 min; cached after that).
# The repo is mounted at /workspace so edits on the host are live inside.

services:
  dev:
    build:
      context: ../..
      dockerfile: dev/docker/Dockerfile.dev
      args:
        PG_MAJOR: "17"
        PG_VERSION: "17.5-1.pgdg120+1"
        ZIG_VERSION: "0.17.1"
    image: tsfm-pg-dev:pg17
    volumes:
      - ../..:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    tmpfs:
      - /run/postgresql
